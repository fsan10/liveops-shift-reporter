<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直播间排班</title>
<style>
  :root{
    --primary:#4269ee; --primary-2:#5478f0; --primary-soft:#7895f6;
    --ink:#14213a; --ink-2:#34435e; --muted:#8290a8; --line:#e9edf4;
    --bg:#f5f7fb; --card:#FFFFFF;
    --rest:#FED4A4; --shoot:#F9E5D7;
    --green:#34C724; --danger:#F54A45; --warn:#FF8800; --info:#4E83FD;
    --shadow:0 2px 10px rgba(31,35,41,.06); --shadow-lg:0 8px 30px rgba(31,35,41,.14);
    --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{min-height:100%;scrollbar-gutter:stable}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    min-height:100vh;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#cdc8d8;border-radius:8px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#b3aac4}

  /* ============ 顶部栏 ============ */
  .topbar{background:linear-gradient(120deg,#172744,#28478c 55%,#4269ee);color:#fff;
    padding:0 24px;height:64px;display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:60;
    box-shadow:0 2px 16px rgba(23,39,68,.18)}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand .logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.18);
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .brand h1{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .sub{font-size:12px;opacity:.82;margin-top:2px}
  .topbar .spacer{flex:1}
  .search{position:relative;width:230px}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.7}
  .search input{width:100%;height:38px;border-radius:9px;border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.14);color:#fff;padding:0 12px 0 36px;font-size:13px;outline:none}
  .search input::placeholder{color:rgba(255,255,255,.75)}
  .search input:focus{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.5)}
  .tbtn{height:38px;padding:0 14px;border-radius:9px;background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.22);display:inline-flex;align-items:center;gap:7px;
    font-size:13px;color:#fff;transition:.15s;white-space:nowrap}
  .tbtn:hover{background:rgba(255,255,255,.24)}
  .tbtn.primary{background:#fff;color:var(--primary);font-weight:600;border-color:#fff}
  .tbtn.primary:hover{background:#f3eeff}

  /* ============ 视图切换 ============ */
  .tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line);padding:0 24px;
    position:sticky;top:var(--roster-topbar-height,64px);z-index:50;gap:4}
  .tab{padding:14px 18px;font-size:14px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;
    display:flex;align-items:center;gap:8px;transition:.15s}
  .tab:hover{color:var(--primary)}
  .tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
  .tab .badge{font-size:11px;background:#efe9fc;color:var(--primary);padding:1px 7px;border-radius:10px}

  /* ============ 概览卡片 ============ */
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;padding:20px 24px 4px}
  .stat{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);
    display:flex;align-items:center;gap:13px;border:1px solid #f0eef5}
  .stat .ic{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .stat .num{font-size:22px;font-weight:700;line-height:1.1}
  .stat .lb{font-size:12px;color:var(--muted);margin-top:3px}

  .layout{display:flex;gap:16px;padding:16px 24px 40px;align-items:flex-start}
  .main{flex:1;min-width:0}

  /* ============ 列表视图 ============ */
  .day-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;
    overflow:hidden;border:1px solid #f0eef5}
  .day-head{display:flex;align-items:center;gap:12px;padding:11px 16px;background:linear-gradient(90deg,#f4efff,#faf8ff);
    border-bottom:1px solid #efeaf8}
  .day-date{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-width:58px;background:var(--primary-soft);color:#fff;border-radius:10px;padding:6px 10px;line-height:1.15}
  .day-date .d{font-size:20px;font-weight:700}
  .day-date .w{font-size:11px;opacity:.92}
  .day-meta{display:flex;gap:8px;flex-wrap:wrap;flex:1;align-items:center}
  .holiday-tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;background:#FFECE8;color:#D8392B}
  .holiday-tag.legal{background:#FEE4A8;color:#9A6700}
  .meta-chip{font-size:12px;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;cursor:pointer;transition:.13s;border:1px dashed transparent}
  .meta-chip.rest{background:#FFF1E3;color:#B25B00;border-color:#ffd9b0}
  .meta-chip.shoot{background:#FDEEE5;color:#9C5B30;border-color:#f6d3bd}
  .meta-chip.empty{background:#f6f5f9;color:#9aa0aa;border-style:dashed}
  .meta-chip:hover{filter:brightness(.97);border-color:var(--primary-soft)}
  .meta-chip .plus{font-weight:700}
  .day-add{font-size:12.5px;color:var(--primary);font-weight:600;padding:6px 12px;border-radius:8px;display:inline-flex;align-items:center;gap:5px}
  .day-add:hover{background:#efe9fc}

  table.grid{width:100%;border-collapse:collapse}
  table.grid td{padding:0;border-bottom:1px solid #f0eef5;vertical-align:middle}
  table.grid tr:last-child td{border-bottom:none}
  .cell{height:46px;display:flex;align-items:center;justify-content:center;position:relative}
  .c-time{background:#F2F7E8;color:#4D5A1F;font-weight:600;font-size:13px;cursor:pointer;gap:7px}
  .c-time:hover{background:#E9F2D8}
  .c-time .night{font-size:10px;background:#373C43;color:#fff;border-radius:4px;padding:1px 5px}
  .person-cell{width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:8px;
    cursor:pointer;font-size:13.5px;font-weight:600;position:relative;transition:filter .13s}
  .person-cell:hover{filter:brightness(.94) saturate(1.05)}
  .person-cell .edit-dot{position:absolute;right:8px;opacity:0;transition:.13s;color:rgba(0,0,0,.45)}
  .person-cell:hover .edit-dot{opacity:1}
  .avatar{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;flex-shrink:0;background:rgba(255,255,255,.55)}
  .ops-cell{font-weight:500;color:#2c3e6b}
  .ops-cell .avatar{background:rgba(255,255,255,.6)}
  .empty-cell{color:#b6bcc6;font-size:12.5px;width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
  .empty-cell:hover{color:var(--primary);background:#faf7ff}
  .merged{height:100%;width:100%;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .merged .rest-txt{font-size:13px;font-weight:600;color:#8a4a05;text-align:center;line-height:1.4;padding:6px}
  .merged .shoot-txt{font-size:12.5px;color:#8a4a2a;text-align:center;line-height:1.4;padding:6px}
  .merged.empty .rest-txt,.merged.empty .shoot-txt{color:#b6bcc6;font-weight:400}
  .row-del{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    color:#b6bcc6;margin:auto;transition:.13s}
  .row-del:hover{color:var(--danger);background:#feecec}
  tr.shift-row.has-conflict .person-cell{outline:2px solid var(--danger);outline-offset:-2px;border-radius:6px}

  /* ============ 周历视图 ============ */
  .week{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;border:1px solid #f0eef5}
  .week-title{padding:10px 16px;font-size:13px;font-weight:600;color:var(--muted);background:#faf9fd;border-bottom:1px solid #f0eef5;display:flex;justify-content:space-between}
  .week-grid{display:grid;grid-template-columns:repeat(7,1fr);min-height:150px}
  .week-day{border-right:1px solid #f0eef5;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
  .week-day:last-child{border-right:none}
  .week-day.we{background:#fcfbfe}
  .week-day.out{background:#f7f6f9}
  .wd-head{display:flex;align-items:baseline;gap:6px}
  .wd-head .n{font-size:15px;font-weight:700}
  .wd-head .w{font-size:11px;color:var(--muted)}
  .wd-head.out .n{color:#c2c6ce}
  .wd-head.today .n{background:var(--primary);color:#fff;border-radius:6px;padding:0 6px}
  .wd-legal{font-size:10px;color:#D8392B;font-weight:600}
  .shift-card{border-radius:8px;padding:5px 7px;cursor:pointer;transition:.13s;border:1px solid rgba(0,0,0,.05)}
  .shift-card:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.12)}
  .shift-card .t{font-size:10.5px;font-weight:600;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .shift-card .a{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
  .shift-card .o{font-size:10px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .shift-card.conflict{border:1.5px solid var(--danger)}
  .wd-add{font-size:11px;color:#90a4bc;padding:5px;border-radius:6px;text-align:center;border:1px dashed #dbe5f1;display:block;opacity:.7}
  .week-day:hover .wd-add,.wd-add:focus-visible{opacity:1}
  .wd-add:hover,.wd-add:focus-visible{color:#6394c5;border-color:#b3d1f4;background:#f3f8ff;outline:none}

  /* 历史日期保留人员配色，用灰白蒙版弱化；今日使用浅蓝色外扩柔光。 */
  .history-days{margin-bottom:14px;border:1px solid #dfe4eb;border-radius:12px;background:#eef1f5;color:#788393}
  .history-days>summary{padding:14px 16px;cursor:pointer;font-weight:600}
  .history-days>summary small{margin-left:12px;font-weight:400}
  .history-days[open]>summary{border-bottom:1px solid #dfe4eb}
  .history-days .day-card{margin:10px}
  .is-past{position:relative;isolation:isolate;cursor:not-allowed}
  .is-past::after{content:"";position:absolute;inset:0;border-radius:inherit;
    background:rgba(241,243,247,.48);z-index:5;cursor:not-allowed}
  .is-past>*{pointer-events:none}
  .is-past .edit-dot{display:none}
  .is-past .person-cell,.is-past .empty-cell,.is-past .c-time,.is-past .shift-card,.is-past .meta-chip{
    cursor:not-allowed;transform:none;filter:none;outline:none}
  .is-today{position:relative;z-index:2;border:1px solid #b7d8fb;
    box-shadow:0 0 0 1px rgba(190,220,253,.65),0 0 12px rgba(113,174,245,.28),
    0 0 28px rgba(145,198,254,.22),0 0 48px rgba(169,215,255,.16)}
  .is-today .day-date{background:#d9ebff;color:#5d83ad}
  .week-day.is-today{border-radius:10px;background:#f7fbff}
  .week.has-today{overflow:visible}
  .wd-head.today .n{background:#d9ebff;color:#5d83ad}
  .today-tag{font-size:11px;font-weight:700;color:#6596c5;background:#eaf5ff;padding:3px 7px;border-radius:6px}
  .readonly-tag{font-size:11px;color:#85909f}
  button:disabled{cursor:not-allowed}
  .wd-add{width:100%}

  /* ============ 侧栏统计 ============ */
  .sidebar{width:288px;flex-shrink:0;position:sticky;top:calc(var(--roster-topbar-height,64px) + var(--roster-tabs-height,50px) + 12px);display:flex;flex-direction:column;gap:14px}
  .panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid #f0eef5;overflow:hidden}
  .panel-h{padding:13px 16px;font-size:13.5px;font-weight:700;border-bottom:1px solid #f0eef5;display:flex;align-items:center;gap:8px}
  .panel-h .settings-trigger{margin-left:auto;width:26px;height:26px;display:grid;place-items:center;border-radius:7px;color:#8290a8}
  .panel-h .settings-trigger:hover,.panel-h .settings-trigger[aria-expanded="true"]{background:#eef2ff;color:var(--primary)}
  .panel-h .settings-trigger:focus-visible,.person-add:focus-visible,.person-remove:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  .person-add{width:calc(100% - 28px);margin:0 14px 12px;padding:8px;border:1px dashed #b9c7f3;border-radius:7px;color:var(--primary);font-size:12px;font-weight:600;text-align:center}
  .person-add:hover{background:#eef2ff}
  .person-add[hidden]{display:none}
  .person-remove{margin-left:2px;width:26px;height:26px;display:grid;place-items:center;flex-shrink:0;color:#9aa5b7;border-radius:6px}
  .person-remove:hover{background:#fff0f0;color:var(--danger)}
  .retired-tag{font-size:10px;color:#8f9aab;white-space:nowrap}
  .panel-b{padding:10px 14px 14px;max-height:340px;overflow-y:auto}
  .stat-row{display:flex;align-items:center;gap:9px;padding:6px 4px;cursor:pointer;border-radius:8px;transition:.12s}
  .stat-row:hover{background:#f7f5fc}
  .stat-row .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .stat-row .nm{font-size:13px;width:52px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat-row .bar{flex:1;height:7px;background:#f0edf7;border-radius:5px;overflow:hidden}
  .stat-row .bar i{display:block;height:100%;border-radius:5px;transition:width .4s}
  .stat-row .ct{font-size:12px;color:var(--muted);width:30px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
  .legend{padding:12px 16px;font-size:12px;color:var(--muted);line-height:1.9}
  .legend .li{display:flex;align-items:center;gap:8px}
  .legend .sw{width:14px;height:14px;border-radius:4px;flex-shrink:0}

  /* 筛选高亮 */
  body.filtering .person-cell,body.filtering .day-card,body.filtering .shift-card{opacity:.28}
  body.filtering .person-cell.hl,body.filtering .shift-card.hl,body.filtering .day-card.has-hl{opacity:1}
  body.filtering .shift-card.hl{box-shadow:0 0 0 2px var(--primary)}

  /* ============ 弹层 ============ */
  .mask{position:fixed;inset:0;background:rgba(31,35,41,.32);z-index:80;display:none;align-items:flex-start;justify-content:center}
  .mask.show{display:flex;animation:fade .15s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .popover{position:fixed;z-index:90;background:#fff;border-radius:12px;box-shadow:var(--shadow-lg);
    width:248px;overflow:hidden;display:none;animation:pop .14s}
  .popover.show{display:block}
  @keyframes pop{from{transform:translateY(-4px);opacity:0}to{transform:translateY(0);opacity:1}}
  .pop-search{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .pop-search input{flex:1;border:none;outline:none;font-size:13.5px}
  .pop-list{max-height:240px;overflow-y:auto;padding:6px}
  .pop-opt{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13.5px}
  .pop-opt:hover{background:#f4f1fb}
  .pop-opt.sel{background:#efe9fc;color:var(--primary);font-weight:600}
  .pop-opt .sw{width:18px;height:18px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
  .pop-opt .ck{margin-left:auto;color:var(--primary);display:none}
  .pop-opt.sel .ck{display:block}
  .pop-foot{display:flex;justify-content:space-between;padding:8px;border-top:1px solid var(--line);gap:8px}
  .pop-foot button{font-size:12.5px;padding:6px 10px;border-radius:7px;color:var(--muted)}
  .pop-foot button:hover{background:#f2f1f5}
  .pop-foot .ok{background:var(--primary);color:#fff;font-weight:600}
  .pop-foot .ok:hover{background:#5520b3}
  .pop-hint{padding:7px 12px;font-size:11px;color:var(--muted);background:#faf9fd;border-top:1px solid #f0eef5}

  /* 月历班次：一级字段菜单和紧邻的二级设置面板。 */
  .shift-menu{display:none;position:fixed;z-index:95;width:230px;padding:7px;background:#fff;
    border:1px solid #e5ebf4;border-radius:13px;box-shadow:0 12px 36px #22365920,0 2px 8px #2236590a}
  .shift-menu.show{display:block;animation:pop .14s}
  .shift-menu-heading{padding:7px 9px 10px;font-size:12px;color:#8995a7;border-bottom:1px solid #edf1f6;margin-bottom:4px}
  .shift-menu-item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 10px;border-radius:8px;text-align:left}
  .shift-menu-item .field-name{width:30px;font-size:13px;color:#465871;flex-shrink:0}
  .shift-menu-item strong{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:500;color:#8995a7}
  .shift-menu-item .chevron{color:#b3c1d4;font-size:18px;line-height:1}
  .shift-menu-item:hover,.shift-menu-item[aria-expanded="true"]{background:#f0f6ff}
  .shift-menu-item:focus-visible,.shift-submenu button:focus-visible{outline:2px solid #a4caf6;outline-offset:-2px}
  .shift-submenu{display:none;position:absolute;left:calc(100% + 7px);top:36px;width:300px;padding:14px;background:#fff;
    border:1px solid #e5ebf4;border-radius:13px;box-shadow:0 12px 36px #22365920,0 2px 8px #2236590a;
    max-height:calc(100dvh - 24px);overflow-y:auto}
  .shift-submenu.show{display:block}
  .shift-submenu.to-left{left:auto;right:calc(100% + 7px)}
  .shift-submenu::before{content:"";position:absolute;right:100%;top:0;width:8px;height:100%}
  .shift-submenu.to-left::before{right:auto;left:100%}
  .shift-submenu h3{font-size:14px;font-weight:600;color:#465871;margin-bottom:12px}
  .shift-submenu label{display:block;color:#8b98aa;font-size:12px;margin-bottom:6px}
  .shift-submenu input{height:36px;width:100%;border:1px solid #dde6f2;border-radius:8px;padding:0 10px;font:inherit;font-size:13px;outline:none}
  .shift-submenu input:focus{border-color:#a5caf5;box-shadow:0 0 0 3px #d9eaff66}
  .shift-time-inputs{display:flex;align-items:center;gap:7px;margin-bottom:12px}
  .shift-time-inputs input{min-width:0}
  .shift-options{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;max-height:220px;overflow:auto}
  .shift-option{padding:9px 7px;font-size:12px;border:1px solid #e9eef6;border-radius:7px;color:#60718b;display:flex;align-items:center;gap:7px}
  .shift-option:hover,.shift-option.selected{border-color:#c3dafa;background:#f1f7ff;color:#5982b2}
  .shift-option .sw{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .shift-submenu-footer{display:flex;justify-content:flex-end;gap:7px;margin-top:12px;padding-top:10px;border-top:1px solid #edf1f6}
  .shift-submenu-footer button{padding:7px 10px;font-size:12px;border-radius:7px;color:#8995a7}
  .shift-submenu-footer .save{background:#e9f3ff;color:#5c89b8;font-weight:600}
  .shift-submenu-empty{font-size:12px;color:#9aa6b7;padding:12px 0}
  @media(max-width:650px){
    .shift-menu{width:min(340px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto}
    .shift-submenu,.shift-submenu.to-left{position:static;width:100%;box-shadow:none;margin-top:7px;border-radius:9px}
    .shift-options{max-height:140px}
  }
  @media(prefers-reduced-motion:reduce){.shift-menu.show{animation:none}}

  /* 时段编辑弹窗 */
  .modal{background:#fff;border-radius:14px;width:380px;margin-top:14vh;box-shadow:var(--shadow-lg);overflow:hidden;animation:pop .16s}
  .modal-h{padding:16px 18px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
  .modal-h .x{color:#9aa0aa;width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center}
  .modal-h .x:hover{background:#f2f1f5}
  .modal-b{padding:4px 18px 18px}
  .field{margin-bottom:14px}
  .field label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:6px}
  .field input{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;padding:0 12px;font-size:14px;outline:none}
  .field input:focus{border-color:var(--primary-soft);box-shadow:0 0 0 3px rgba(124,58,237,.12)}
  .tpl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .tpl{padding:9px;border:1px solid var(--line);border-radius:9px;font-size:12.5px;text-align:center;cursor:pointer;transition:.12s}
  .tpl:hover,.tpl.sel{border-color:var(--primary);background:#f6f2ff;color:var(--primary);font-weight:600}
  .modal-f{display:flex;gap:10px;justify-content:flex-end;padding-top:4px}
  .btn{height:38px;padding:0 18px;border-radius:9px;font-size:13.5px;font-weight:600}
  .btn.ghost{background:#f2f1f5;color:var(--ink-2)}
  .btn.ghost:hover{background:#e8e6ee}
  .btn.solid{background:var(--primary);color:#fff}
  .btn.solid:hover{background:#5520b3}
  .btn.danger{background:#feecec;color:var(--danger)}

  /* toast */
  .toast-wrap{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:9px;align-items:center}
  .toast{background:#2c2438;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);
    display:flex;align-items:center;gap:12px;animation:pop .18s}
  .toast.warn{background:#8a4b00}.toast.err{background:#a01f1f}
  .toast button{color:#cdb4ff;font-size:12.5px;font-weight:600}
  .toast button:hover{color:#fff}

  @media (max-width:1180px){
    .stats{grid-template-columns:repeat(3,1fr)}
    .layout{flex-direction:column}
    .sidebar{order:-1;width:100%;position:static;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  .month-switch{display:flex;align-items:center;gap:5px;white-space:nowrap;font-size:13px}
  .month-switch button{min-width:25px;height:30px;padding:0 5px;border-radius:6px;color:#fff;background:rgba(255,255,255,.13)}
  .month-switch button:hover{background:rgba(255,255,255,.28)}
  .month-switch strong{min-width:84px;text-align:center}
  table.grid{table-layout:fixed}
  table.grid td:nth-child(1){width:20%}table.grid td:nth-child(2),table.grid td:nth-child(3){width:22%}
  table.grid td:nth-child(4){width:36%}
  .row-actions{display:flex;align-items:center;justify-content:flex-end;gap:5px;padding:3px 8px;white-space:nowrap}
  .row-action{padding:5px 7px;border:1px solid #e3e9f3;border-radius:6px;color:#52627e;background:white;font-size:11px}
  .row-action:hover{color:var(--primary);background:#eef2ff;border-color:#b9c7f3}
  .row-action:disabled{opacity:.5;cursor:default}
  .row-status{font-size:11px;color:#0b956a;margin-right:auto}
  .row-status.off{color:#97a3b6}.row-status.report{color:#526be0}
  .day-date{background:#7895f6}.day-head{background:linear-gradient(90deg,#eef2ff,#f8faff);border-bottom-color:#e5ebfa}
  .stat{border-color:#e9edf4}.stat-row:hover{background:#f2f5ff}.panel{border-color:#e9edf4}
  .pop-opt:hover,.pop-opt.sel{background:#eef2ff}.pop-opt.sel,.pop-opt .ck{color:var(--primary)}
  .pop-foot .ok:hover,.btn.solid:hover{background:#3459da}.tpl:hover,.tpl.sel{background:#eef2ff}
  .toast button{color:#adc0ff}
  @media(max-width:1450px){.topbar{position:sticky;flex-wrap:wrap;height:auto;min-height:64px;padding:10px 16px;gap:9px}}
  @media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr);padding:12px}.layout{padding:12px}.sidebar{grid-template-columns:1fr}.search{width:100%;order:8}.topbar .spacer{display:none}.month-switch{order:3}.tbtn{font-size:11px}.day-card{overflow-x:auto}table.grid{min-width:700px}.tabs{padding:0 9px}.tabs>span:last-child{display:none!important}}
</style>

    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>

  </button>
</header>

<!-- 视图切换 -->
<nav class="tabs">

    <button class="tab" data-view="week">

    月历视图
  </button>

  <span style="display:flex;align-items:center;font-size:12px;color:var(--muted);padding-bottom:2px">

function emptyMonth(month){
  const [year, monthNumber] = month.split('-').map(Number);
  const count = new Date(year, monthNumber, 0).getDate();
  const weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  return {title:`${year}年${monthNumber}月直播间排班`,days:Array.from({length:count},(_,i)=>{
    const date = new Date(year,monthNumber-1,i+1);
    return {weekday:weekdays[date.getDay()],date:`${year}/${monthNumber}/${i+1}`,rest:'',shoot:'',shifts:[]};
  })};
}

async function request(path,options={}){
  const response=await fetch(path,{headers:{'Content-Type':'application/json'},...options});
  const result=await response.json().catch(()=>({}));
  if(!response.ok){const error=new Error(result.detail||`请求失败 (${response.status})`);error.status=response.status;throw error;}
  return result;
}
const PENDING_PEOPLE_KEY='liveops_roster_people_pending_v1';
function parsePeople(value,fallback){
  try{const people=JSON.parse(value);return Array.isArray(people)&&people.every(name=>typeof name==='string')?people:fallback;}catch{return fallback;}
}
function pendingPeople(){
  try{const value=JSON.parse(localStorage.getItem(PENDING_PEOPLE_KEY)||'null');return value&&Array.isArray(value.anchor)&&Array.isArray(value.ops)?value:null;}catch{return null;}
}
function applyPeople(anchor,ops){ANCHOR_POOL=[...anchor];OPS_POOL=[...ops];renderSidebar();}
async function loadPeople(){
  const {settings}=await request('/api/settings');
  const pending=pendingPeople();
  if(typeof settings.roster_anchor_pool!=='string'||typeof settings.roster_promoter_pool!=='string'){
    if(pending)applyPeople(pending.anchor,pending.ops);
    return;
  }
  const anchors=parsePeople(settings.roster_anchor_pool,DEFAULT_ANCHORS);
  const promoters=parsePeople(settings.roster_promoter_pool,DEFAULT_PROMOTERS);
  if(pending&&JSON.stringify(anchors)===JSON.stringify(DEFAULT_ANCHORS)&&JSON.stringify(promoters)===JSON.stringify(DEFAULT_PROMOTERS)){
    try{
      await request('/api/settings',{method:'PUT',body:JSON.stringify({values:{roster_anchor_pool:JSON.stringify(pending.anchor),roster_promoter_pool:JSON.stringify(pending.ops)}})});
      localStorage.removeItem(PENDING_PEOPLE_KEY);applyPeople(pending.anchor,pending.ops);return;
    }catch{applyPeople(pending.anchor,pending.ops);return;}
  }
  localStorage.removeItem(PENDING_PEOPLE_KEY);
  applyPeople(anchors,promoters);
}
async function savePeople(field,names){
  const anchors=field==='anchor'?names:ANCHOR_POOL;
  const promoters=field==='ops'?names:OPS_POOL;
  const values={roster_anchor_pool:JSON.stringify(anchors),roster_promoter_pool:JSON.stringify(promoters)};
  try{await request('/api/settings',{method:'PUT',body:JSON.stringify({values})});localStorage.removeItem(PENDING_PEOPLE_KEY);}
  catch(error){
    if(error.status!==422||!error.message.includes('未知设置项'))throw error;
    localStorage.setItem(PENDING_PEOPLE_KEY,JSON.stringify({anchor:anchors,ops:promoters}));
    toast('名单已暂存此浏览器；服务重启后自动同步');
  }
  applyPeople(anchors,promoters);
}
function iso(day){const [y,m,d]=day.date.split('/');return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;}
function isPastDay(day){return iso(day)<todayIso();}
function ensureEditableDay(day){
  if(!day)return false;
  if(isPastDay(day)){toast('历史日期的排班只读，不能新增或修改','warn');return false;}
  return true;
}
function editAttrs(day,kind,si,field){
  if(isPastDay(day))return 'aria-disabled="true"';
  return `role="button" tabindex="0" data-edit="${kind}" data-day="${dayNum(day)}"${si==null?'':` data-shift="${si}"`}${field?` data-field="${field}"`:''}`;
}
function focusToday(){
  requestAnimationFrame(()=>{
    updateStickyOffsets();
    const target=document.querySelector('#mainArea .is-today');
    if(!target||!target.getClientRects().length)return;
    const offset=rosterTopbar.getBoundingClientRect().height+rosterTabs.getBoundingClientRect().height+16;
    window.scrollTo({top:Math.max(0,window.scrollY+target.getBoundingClientRect().top-offset),behavior:'instant'});
  });
}
async function openCurrentRoster(){
  closeShiftMenu();closePop();closeTime();
  historyExpanded=false;filterPerson=null;searchQ='';document.getElementById('searchInput').value='';
  if(currentMonth!==todayIso().slice(0,7)){await setMonth(0);return;}
  await syncPromise;
  await loadRemote({focus:true});
}
function shiftPayload(day,shift){
  const [start,end]=(shift.time||'').split('-');
  return {work_date:iso(day),start_time:start,end_time:end,host_name:shift.anchor,
    promoter:shift.ops||'',shop_name:shift.shop_name||'',live_room_id:shift.live_room_id||'',
    qianchuan_account_id:shift.qianchuan_account_id||'',message_template:shift.message_template||'',enabled:shift.enabled!==false};
}
function persistDrafts(){
  try{localStorage.setItem(STORE_KEY(),JSON.stringify(data.days.map(day=>({date:day.date,shifts:day.shifts.filter(shift=>!shift.id)}))));}catch(e){}
}
function removeAccidentalOctoberFirstDrafts(rows){
  // Only the explicitly reported accidental, entirely empty local shift is removed.
  // Persisted shifts and drafts with any operator input remain untouched.
  let removed=0;
  const cleaned=rows.map(day=>{
    if(day.date!=='2026/10/1'||!Array.isArray(day.shifts))return day;
    const shifts=day.shifts.filter(shift=>{
      const accidental=shift&&!shift.id&&['time','anchor','ops'].every(field=>!String(shift[field]||'').trim());
      if(accidental)removed++;
      return !accidental;
    });
    return {...day,shifts};
  });
  return {rows:cleaned,removed};
}
async function loadRemote({focus=false}={}){
  const sequence=++remoteLoadSequence;
  const loadedMonth=currentMonth;
  const [year,month]=currentMonth.split('-');
  const result=await request(`/api/schedules?year=${year}&month=${month}`);
  if(sequence!==remoteLoadSequence||loadedMonth!==currentMonth)return;
  const fresh=emptyMonth(currentMonth);
  const byDate=new Map(fresh.days.map(day=>[iso(day),day]));
  for(const [date,notes] of Object.entries(result.days||{})){
    const day=byDate.get(date);if(day){day.rest=notes.rest||'';day.shoot=notes.shoot||'';}
  }
  for(const row of result.items||[]){
    const day=byDate.get(row.work_date);if(!day)continue;
    day.shifts.push({id:row.id,time:`${row.start_time.slice(0,5)}-${row.end_time.slice(0,5)}`,
      anchor:row.host_name,ops:row.promoter||row.ops||'',enabled:row.enabled,report_id:row.report_id,interruptions:row.interruptions||[],
      shop_name:row.shop_name,live_room_id:row.live_room_id,qianchuan_account_id:row.qianchuan_account_id,
      message_template:row.message_template});
  }
  serverData=clone(fresh);
  try{
    const storedRows=JSON.parse(localStorage.getItem(STORE_KEY())||'[]');
    const {rows:draftRows,removed}=removeAccidentalOctoberFirstDrafts(storedRows);
    if(removed){localStorage.setItem(STORE_KEY(),JSON.stringify(draftRows));toast('已删除 10 月 1 日误加的空班次');}
    for(const draftDay of draftRows){
      const day=fresh.days.find(item=>item.date===draftDay.date);
      if(day)day.shifts.push(...(draftDay.shifts||[]).filter(shift=>!shift.id));
    }
  }catch(e){}
  closeShiftMenu();data=fresh;renderAll();updateMonthHeader();
  if(focus)focusToday();
  showRosterStatus('已连接排班数据');
}
function updateMonthHeader(){
  const [year,month]=currentMonth.split('-').map(Number);
  document.getElementById('monthLabel').textContent=`${year}年${month}月`;
  document.getElementById('monthSub').textContent=`${year}年${month}月 · 点击班次中的选项直接修改`;
  for(const id of ['autoBtn','resetBtn']){
    const button=document.getElementById(id);
    button.disabled=currentMonth<todayIso().slice(0,7);
    button.title=button.disabled?'历史月份只读':'';
  }
}
function syncData(){
  syncPromise=syncPromise.then(async()=>{
    while(true){
      let change=null;
      for(let i=0;i<data.days.length&&!change;i++){
        const day=data.days[i],saved=serverData.days[i];
        if(!saved)break;
        // Retained historical drafts are visible for audit, never sent as new schedules.
        if(isPastDay(day))continue;
        if(day.rest!==saved.rest||day.shoot!==saved.shoot){
          const rest=day.rest,shoot=day.shoot;
          change=async()=>{await request(`/api/schedule-days/${iso(day)}`,{method:'PUT',body:JSON.stringify({rest,shoot})});saved.rest=rest;saved.shoot=shoot;};break;
        }
        for(const old of saved.shifts){
          if(!day.shifts.some(item=>item.id===old.id)){
            change=async()=>{await request(`/api/schedules/${old.id}`,{method:'DELETE'});saved.shifts=saved.shifts.filter(item=>item.id!==old.id);};break;
          }
        }
        if(change)break;
        for(const shift of day.shifts){
          if(!shift.time||!shift.anchor)continue;
          const old=shift.id?saved.shifts.find(item=>item.id===shift.id):null;
          if(!shift.id){
            const next=clone(shift);
            change=async()=>{const result=await request('/api/schedules',{method:'POST',body:JSON.stringify(shiftPayload(day,next))});shift.id=result.item.id;saved.shifts.push({...next,id:result.item.id});persistDrafts();};break;
          }
          if(old&&['time','anchor','ops'].some(key=>old[key]!==shift[key])){
            const next=clone(shift);
            change=async()=>{await request(`/api/schedules/${shift.id}`,{method:'PUT',body:JSON.stringify(shiftPayload(day,next))});Object.assign(old,next);};break;
          }
        }
      }
      if(!change)break;
      await change();
    }
    persistDrafts();renderAll();showRosterStatus('已同步到排班数据');
  }).catch(async error=>{
    toast(error.message||String(error),'err');
    await loadRemote().catch(err=>toast(err.message||String(err),'err'));
  });
  return syncPromise;
}
async function setMonth(delta){
  closeShiftMenu();closePop();closeTime();
  clearTimeout(saveTimer);persistDrafts();await syncPromise;
  const [year,month]=currentMonth.split('-').map(Number);
  const next=new Date(year,month-1+delta,1);
  currentMonth=delta===0?todayIso().slice(0,7):`${next.getFullYear()}-${String(next.getMonth()+1).padStart(2,'0')}`;
  historyExpanded=false;
  filterPerson=null;searchQ='';document.getElementById('searchInput').value='';
  data=emptyMonth(currentMonth);serverData=emptyMonth(currentMonth);renderAll();updateMonthHeader();
  await loadRemote({focus:true});
  if(currentMonth!==todayIso().slice(0,7))window.scrollTo(0,0);
}

/* ================= 工具 ================= */
function colorOf(name){return PERSON_COLORS[name]||"#D8D4E2";}
function textOn(hex){ // 根据底色返回黑/白字
  const h=hex.replace('#','');
  const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
  const lum=(0.299*r+0.587*g+0.114*b)/255;
  return lum>0.62?"#2B2F36":"#fff";
}
function initial(name){return name?name.slice(0,1):"?";}
const NON_PERSON=new Set(["年假","休息","调休","法定","请假","事假","病假","补班"]);
function splitPeople(s){return (s||"").split('/').map(x=>x.replace(/【.*?】/g,'').trim())
  .filter(x=>x&&!NON_PERSON.has(x));}
function dayNum(d){return parseInt(d.date.split('/')[2],10);}
function isNight(time){return /01:00|02:00/.test(time);}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* 冲突检测：返回某天的冲突信息 */
function dayConflicts(day){
  const issues=[];
  const anchors=day.shifts.map(s=>s.anchor).filter(Boolean);
  const restSet=splitPeople(day.rest);
  day.shifts.forEach((s,i)=>{
    if(s.anchor && anchors.filter(a=>a===s.anchor).length>1)
      issues.push({shift:i,msg:`主播「${s.anchor}」当天重复排班`});
    if(s.anchor && s.ops && s.anchor===s.ops)
      issues.push({shift:i,msg:`「${s.anchor}」不能同时担任主播与投手`});
    if(s.anchor && restSet.includes(s.anchor))
      issues.push({shift:i,msg:`「${s.anchor}」当天休息，却排了主播`});
    if(!s.time||!s.anchor)
      issues.push({shift:i,msg:"时段或主播未填写完整",warn:true});
  });
  return issues;
}
function conflictShiftSet(day){return new Set(dayConflicts(day).map(x=>x.shift));}

  const offset=(new Date(year,month-1,1).getDay()+6)%7;
  const cells=[];
  for(let i=0;i<offset;i++) cells.push({out:true});
  for(let n=1;n<=data.days.length;n++) cells.push({day:n});
  while(cells.length%7!==0) cells.push({out:true,after:true});
  const weeks=[];
  for(let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));
  const wdNames=["周一","周二","周三","周四","周五","周六","周日"];

/* ================= 渲染：侧栏统计 ================= */
function countShifts(field){
  const m=Object.create(null);
  data.days.forEach(d=>d.shifts.forEach(s=>{
    if(s[field]) m[s[field]]=(m[s[field]]||0)+1;
  }));
  // 补充候选池里为0的人
  const pool=field==='anchor'?ANCHOR_POOL:OPS_POOL;
  pool.forEach(p=>{if(!(p in m))m[p]=0;});
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}

function buildPopList(pool,q,multi,cur){

async function handleRowAction(button){
  if(button.disabled)return;
  const day=data.days.find(item=>dayNum(item)===Number(button.dataset.day));
  if(!ensureEditableDay(day))return;
  const shift=day?.shifts[Number(button.dataset.shift)];if(!shift)return;
  if(button.dataset.action==='delete'){
    if(shift.report_id){toast('已有采集报告的班次请停用保留','err');return;}
    delShift(Number(button.dataset.day),Number(button.dataset.shift));return;
  }
  if(!shift.id)return;
  if(button.dataset.action==='interrupt'){openInterruption(day,shift);return;}
  await syncPromise;
  button.disabled=true;
  try{
    const action=button.dataset.action;
    await request(`/api/schedules/${shift.id}/${action==='run'?'run':'toggle'}`,{method:'POST'});
    toast(action==='run'?'已加入人工采集队列':'排班状态已更新');
    await loadRemote();
  }finally{button.disabled=false;}
}

let interruptTarget=null;
function shiftDates(day,shift){
  // Empty or partial drafts must not break rendering of the whole roster.
  const parts=typeof shift.time==='string'?shift.time.split('-'):[];
  if(parts.length!==2)return null;
  const normalize=value=>{
    const match=value.trim().match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
    if(!match||Number(match[1])>23||Number(match[2])>59||Number(match[3]||0)>59)return null;
    return `${match[1].padStart(2,'0')}:${match[2]}:${match[3]||'00'}`;
  };
  const left=normalize(parts[0]),right=normalize(parts[1]);
  if(!left||!right||left===right)return null;
  const start=new Date(`${iso(day)}T${left}+08:00`);
  const end=new Date(`${iso(day)}T${right}+08:00`);
  if(end<=start)end.setTime(end.getTime()+86400000);
  return {start,end};
}
function interruptButtonHTML(day,shift,n,si){
  const dates=shiftDates(day,shift);
  const enabled=shift.id&&shift.enabled!==false&&iso(day)===todayIso()&&dates&&dates.start<=new Date();
  const events=shift.interruptions||[];
  const badge=events.length?`<span class="row-status">中断 ${events.length} 次${events.some(e=>e.status==='partial')?' · 待重试':''}</span>`:'';
  return `${badge}<button class="row-action" data-action="interrupt" data-day="${n}" data-shift="${si}" ${enabled?'':'disabled title="当天班次开始后可标记中断"'}>标记中断</button>`;
}
function localInputTime(date){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}T${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}:${String(date.getSeconds()).padStart(2,'0')}`;}
function openInterruption(day,shift){
  const dates=shiftDates(day,shift);
  if(!dates||!ensureEditableDay(day))return;
  interruptTarget=shift;
  const {start,end}=dates,now=new Date(),maximum=new Date(Math.min(now.getTime(),end.getTime()-1000));
  document.getElementById('interruptShift').textContent=`${shift.anchor} · ${iso(day)} ${shift.time}`;
  const input=document.getElementById('interruptTime');
  input.min=localInputTime(start);input.max=localInputTime(maximum);input.value=input.max;
  const history=document.getElementById('interruptHistory');history.replaceChildren();
  for(const event of shift.interruptions||[]){
    const button=document.createElement('button');button.className='row-action';button.textContent=`${event.interrupted_at.replace('T',' ').slice(0,19)} · ${event.status==='partial'?'数据不完整，重试':'已保存，重采此场'}`;
    button.onclick=()=>{input.value=event.interrupted_at.slice(0,19);};history.append(button);
  }
  document.getElementById('interruptMask').classList.add('show');input.focus();
}
document.getElementById('interruptSave').addEventListener('click',async event=>{
  const input=document.getElementById('interruptTime');
  if(!interruptTarget||!input.value||!input.reportValidity())return;
  const button=event.currentTarget;button.disabled=true;
  try{
    await syncPromise;
    const result=await request(`/api/schedules/${interruptTarget.id}/interrupt`,{method:'POST',body:JSON.stringify({interrupted_at:input.value})});
    document.getElementById('interruptMask').classList.remove('show');toast('已加入中断采集队列，完成后保存旧场片段');await loadRemote();
    pollInterruption(result.run.id);
  }catch(error){toast(error.message||String(error),'err');}finally{button.disabled=false;}
});
async function pollInterruption(runId){
  try{
    const result=await request(`/api/runs/${runId}`),run=result.item;
    if(['queued','running'].includes(run.status)){setTimeout(()=>pollInterruption(runId),3000);return;}
    toast(run.message,run.status==='succeeded'?'ok':'err');await loadRemote();
  }catch(error){toast(error.message||String(error),'err');}
}

/* 侧栏人员管理与筛选 */
document.querySelector('.sidebar').addEventListener('click',e=>{
  const manage=e.target.closest('[data-manage]');
  if(manage){manageOpen[manage.dataset.manage]=!manageOpen[manage.dataset.manage];renderSidebar();return;}
  const add=e.target.closest('[data-add-person]');
  if(add){openPop(add,{mode:'add-person',field:add.dataset.addPerson});return;}
  const remove=e.target.closest('[data-remove-person]');
  if(remove){
    const field=remove.dataset.removePerson,name=remove.dataset.name;
    const label=field==='anchor'?'主播':'投手';
    if(!confirm(`将${label}“${name}”移出可选名单？已有排班会保留。`))return;
    const pool=field==='anchor'?ANCHOR_POOL:OPS_POOL;
    savePeople(field,pool.filter(person=>person!==name)).then(()=>toast(`已移出${label} ${name}`)).catch(error=>toast(error.message||String(error),'err'));
    return;
  }
  const r=e.target.closest('[data-filter]');if(!r)return;
  const nm=r.dataset.filter;
  filterPerson = filterPerson===nm?null:nm;
  searchQ="";document.getElementById('searchInput').value="";
  renderAll();
  if(filterPerson) toast(`已高亮「${filterPerson}」的全部排班，再次点击该人员取消`);
});

/* 视图切换 */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); view=t.dataset.view;
  renderAll();
  openCurrentRoster().catch(error=>toast(error.message||String(error),'err'));
}));
document.getElementById('prevMonth').addEventListener('click',()=>setMonth(-1).catch(error=>toast(error.message||String(error),'err')));
document.getElementById('nextMonth').addEventListener('click',()=>setMonth(1).catch(error=>toast(error.message||String(error),'err')));
document.getElementById('thisMonth').addEventListener('click',()=>setMonth(0).catch(error=>toast(error.message||String(error),'err')));
document.getElementById('autoBtn').addEventListener('click',async()=>{
  if(currentMonth<todayIso().slice(0,7)){toast('历史月份不能自动排班','warn');return;}
  if(data.days.some(day=>day.shifts.length||day.rest||day.shoot)){toast('该月已有排班或备注，请选择空月份自动排班','err');return;}
  const [year,month]=currentMonth.split('-').map(Number);
  if(!confirm(`按 2026 年 10 月班表生成 ${year} 年 ${month} 月排班？`))return;
  const button=document.getElementById('autoBtn');button.disabled=true;
  try{const result=await request('/api/schedules/auto-fill',{method:'POST',body:JSON.stringify({year,month})});await loadRemote();toast(`已自动生成 ${result.count} 个班次`);}
  catch(error){toast(error.message||String(error),'err');}finally{button.disabled=false;}
});

/* 搜索 */
document.getElementById('searchInput').addEventListener('input',e=>{
  searchQ=e.target.value.trim(); filterPerson=null;
  document.body.classList.remove('filtering');
  if(view==='list')renderList();

/* 重置 */
document.getElementById('resetBtn').addEventListener('click',async()=>{
  if(currentMonth<todayIso().slice(0,7)){toast('历史月份不能恢复排班','warn');return;}
  const [year,month]=currentMonth.split('-').map(Number);
  if(!confirm(`恢复 ${year} 年 ${month} 月今天及未来日期的模板排班？未产生报告的班次及备注将被替换，历史日期保留。`))return;
  const button=document.getElementById('resetBtn');button.disabled=true;
  try{await syncPromise;const result=await request('/api/schedules/auto-fill',{method:'POST',body:JSON.stringify({year,month,replace:true})});
    const historyDrafts=data.days.filter(isPastDay).map(day=>({date:day.date,shifts:day.shifts.filter(shift=>!shift.id)}));
    localStorage.setItem(STORE_KEY(),JSON.stringify(historyDrafts));await loadRemote();toast(`已恢复模板排班，共 ${result.count} 个班次`);}
  catch(error){toast(error.message||String(error),'err');}finally{button.disabled=false;}
});

/* 导出 CSV（还原7列结构） */
document.getElementById('exportBtn').addEventListener('click',()=>{
  const head=["星期","日期","时段","主播","投手","休息","日常拍摄"];
  const lines=[head.join(',')];
  data.days.forEach(d=>{
    d.shifts.forEach((s,i)=>{
      const a=i===0?[d.weekday,d.date]:["",""];
      const f=i===0?[d.rest,d.shoot]:["",""];
      const row=[...a,s.time,s.anchor,s.ops,...f].map(x=>`"${(x||"").replace(/"/g,'""')}"`);
      lines.push(row.join(','));
    });
  });
  const blob=new Blob(["\uFEFF"+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=`${currentMonth}直播间排班.csv`; a.click();URL.revokeObjectURL(a.href);
  toast("已导出 CSV 文件");
});

/* ================= Toast ================= */
function toast(msg,type,canUndo){
  const wrap=document.getElementById('toastWrap');
  const el=document.createElement('div');
  el.className='toast '+(type||'');
  el.innerHTML=`<span>${esc(msg)}</span>${canUndo?'<button id="undoBtn">撤销</button>':''}`;
  wrap.appendChild(el);
  if(canUndo){
    el.querySelector('#undoBtn').addEventListener('click',()=>{
      if(undoSnap){data=undoSnap;undoSnap=null;save();renderAll();syncData();toast("已撤销");}
    });
  }
  setTimeout(()=>{el.style.transition='opacity .3s';el.style.opacity='0';setTimeout(()=>el.remove(),300);},3600);
}

function afterChange(){save();renderAll();checkGlobalConflicts();syncData();}
function checkGlobalConflicts(){
  let n=0;
  data.days.forEach(d=>{n+=dayConflicts(d).filter(x=>!x.warn).length;});
  return n;
}

    closePop();closeTime();
    if(shiftMenuCtx){
      const card=document.querySelector(`[data-edit="shift"][data-day="${shiftMenuCtx.day}"][data-shift="${shiftMenuCtx.si}"]`);
      closeShiftMenu();card?.focus({preventScroll:true});
    }
  }
});

/* 初始化 */
const rosterTopbar=document.querySelector('.topbar');
const rosterTabs=document.querySelector('.tabs');
const updateStickyOffsets=()=>{
  document.documentElement.style.setProperty('--roster-topbar-height',`${rosterTopbar.getBoundingClientRect().height}px`);
  document.documentElement.style.setProperty('--roster-tabs-height',`${rosterTabs.getBoundingClientRect().height}px`);
};
new ResizeObserver(updateStickyOffsets).observe(rosterTopbar);
new ResizeObserver(updateStickyOffsets).observe(rosterTabs);
updateStickyOffsets();
document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===view));
renderAll();
const initialConflicts=checkGlobalConflicts();
if(initialConflicts>0) setTimeout(()=>toast(`检测到 ${initialConflicts} 处排班冲突，已用红色标出，请核对`,"warn"),500);
loadRemote({focus:true}).catch(error=>toast(error.message||String(error),'err'));
loadPeople().catch(error=>toast(error.message||String(error),'err'));
window.addEventListener('message',event=>{
  if(event.origin===location.origin&&event.source===window.parent&&event.data?.type==='liveops:roster-open'){
    openCurrentRoster().catch(error=>toast(error.message||String(error),'err'));return;
  }
  if(event.origin!==location.origin||event.data?.type!=='liveops:roster-refresh')return;
  syncPromise.then(()=>loadRemote()).catch(error=>toast(error.message||String(error),'err'));
});
</script>
