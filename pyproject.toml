[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "liveops-shift-reporter"
version = "0.1.0"
description = "Douyin livestream shift reporting, screenshots, Feishu and Bitable sync"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "playwright>=1.50,<2",
  "httpx[socks]>=0.28,<1",
  "cryptography>=44,<47",
  "python-dotenv>=1,<2",
  "tzdata>=2025.1",
  "python-multipart>=0.0.20,<1",
  "openpyxl>=3.1.5,<4",
  "defusedxml>=0.7.1,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["liveops*"]

[tool.setuptools.package-data]
liveops = ["static/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
